[theme]
base = "light"
# Vanatari corporate design tokens (see Vanatari_CoporateDesign_Booklet)
primaryColor = "#ff5c3e"              # Warm Orange — buttons, focus, primary CTA
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#fbf7f2"  # Light Beige — sidebar, widget wells
textColor = "#3c1826"                 # Dark Plum — body text
font = "sans serif"

[server]
runOnSave = true
