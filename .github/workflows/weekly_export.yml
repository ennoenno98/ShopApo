name: Shop Apotheke Weekly Export

on:
  schedule:
    # Every Monday 05:30 UTC
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SHOP_APOTHEKE_API_KEY: ${{ secrets.SHOP_APOTHEKE_API_KEY }}
      BING_DEVELOPER_TOKEN:  ${{ secrets.BING_DEVELOPER_TOKEN }}
      BING_CLIENT_ID:        ${{ secrets.BING_CLIENT_ID }}
      BING_CLIENT_SECRET:    ${{ secrets.BING_CLIENT_SECRET }}
      BING_REFRESH_TOKEN:    ${{ secrets.BING_REFRESH_TOKEN }}
      BING_CUSTOMER_ID:      ${{ secrets.BING_CUSTOMER_ID }}
      BING_ACCOUNT_ID:       ${{ secrets.BING_ACCOUNT_ID }}
      TIKTOK_ACCESS_TOKEN:   ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_ADVERTISER_ID:  ${{ secrets.TIKTOK_ADVERTISER_ID }}
      SA_TECH_EMAIL:         ${{ secrets.SA_TECH_EMAIL }}
      SA_TECH_PASSWORD:      ${{ secrets.SA_TECH_PASSWORD }}
      GRAPH_TENANT_ID:       ${{ secrets.GRAPH_TENANT_ID }}
      GRAPH_CLIENT_ID:       ${{ secrets.GRAPH_CLIENT_ID }}
      GRAPH_CLIENT_SECRET:   ${{ secrets.GRAPH_CLIENT_SECRET }}
      ONEDRIVE_SHARED_LINK:  ${{ secrets.ONEDRIVE_SHARED_LINK }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-export.txt

      - name: Sync ads CSVs from OneDrive
        if: ${{ env.ONEDRIVE_SHARED_LINK != '' }}
        continue-on-error: true
        run: python scripts/onedrive_sync.py

      - name: Install Playwright browser
        if: ${{ env.SA_TECH_EMAIL != '' }}
        run: python -m playwright install --with-deps chromium

      - name: Download Shop Apotheke on-site ads (sa-tech.de)
        if: ${{ env.SA_TECH_EMAIL != '' }}
        continue-on-error: true
        run: python scripts/sa_tech_download.py --days 14 --debug

      - name: Upload sa-tech debug screenshots
        if: always() && env.SA_TECH_EMAIL != ''
        uses: actions/upload-artifact@v4
        with:
          name: sa-tech-screens-${{ github.run_id }}
          path: scripts/sa_tech_screens/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run weekly export
        run: python weekly_export.py --once

      - name: Upload snapshot as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopapo-export-${{ github.run_id }}
          path: exports/
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit snapshot + new ad CSVs to repo (for Streamlit Cloud)
        run: |
          if [[ -n "$(git status --porcelain exports/ inputs/shop_apotheke_ads/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add exports/ inputs/shop_apotheke_ads/
            git commit -m "data: weekly Shop Apotheke refresh"
            git push
          else
            echo "No new data."
          fi
